<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет распределения Вейбулла</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Простые стили для лучшей читаемости */
        body { font-family: sans-serif; margin: 20px; }
        label { display: block; margin-top: 10px; }
        input[type="number"], select { margin-bottom: 10px; padding: 5px; }
        button { margin: 10px 5px 10px 0; padding: 8px 15px; cursor: pointer; }
        #result-area { margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px; }
        #result-text, #monte-carlo-text { color: #007bff; font-weight: bold; }
        canvas { margin-top: 20px; border: 1px solid #ccc; }
        .chart-container { position: relative; height: 40vh; width: 80vw; margin: 20px auto; } /* Для адаптивности графиков */
    </style>
</head>
<body>
    <h1>Расчет распределения Вейбулла</h1>

    <section>
        <h2>Параметры распределения</h2>
        <label for="shape-param">Параметр формы (k или beta):</label>
        <input type="number" id="shape-param" value="1" step="0.1" min="0.01">

        <label for="scale-param">Параметр масштаба (lambda или eta):</label>
        <input type="number" id="scale-param" value="1" step="0.1" min="0.01">

        <label for="x-value">Значение x (необязательно для графика):</label>
        <input type="number" id="x-value" step="0.1" min="0">

        <label for="calculation-type">Тип расчета:</label>
        <select id="calculation-type">
            <option value="pdf">Плотность вероятности (PDF)</option>
            <option value="cdf">Функция распределения (CDF)</option>
            <option value="sf">Функция надежности (SF)</option>
        </select>

        <button id="calculate-button">Рассчитать (PDF/CDF/SF)</button>
        <button id="clear-button">Очистить все</button>

        <div id="result-area">
            <p id="result-text"></p>
        </div>

        <div class="chart-container">
            <canvas id="weibullChart"></canvas>
        </div>
    </section>

    <hr>

    <section>
        <h2>Метод Монте-Карло</h2>
        <label for="monte-carlo-samples">Количество выборок (N):</label>
        <input type="number" id="monte-carlo-samples" value="1000" min="1">

        <button id="monte-carlo-button">Запустить Монте-Карло</button>

        <p id="monte-carlo-text"></p>

        <div class="chart-container">
            <canvas id="monteCarloChart"></canvas>
        </div>
    </section>

    <!-- Подключение Chart.js ДО вашего основного скрипта -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
